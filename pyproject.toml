[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tlf"
version = "1.0.0"
description = "Transmission-line fault detection, classification and location: relay logic vs machine learning on a physics simulator"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mayank Gangwal", email = "mayank.ug23@nsut.ac.in" }]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7", "joblib>=1.3"]

[project.optional-dependencies]
app = ["streamlit>=1.30"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
